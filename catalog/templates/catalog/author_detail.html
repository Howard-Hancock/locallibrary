{% extends "base_generic.html" %}

{% block content %}
  <h1>Author: {{ author }}</h1>
  <p>{{ author.date_of_birth }} - {% if author.date_of_death %}{{ author.date_of_death }}{% endif %}</p>


  <h4>Books</h4>
  <ul>
    {% for book in author.books.all %}
      <li><a href="{{ book.get_absolute_url }}">{{ book.title }}</a><p>{{ book.summary }}</p></li>
    {% endfor %}
  </ul>
{% endblock %}
